name: Update Fitness Calendars
 
on:
workflow_dispatch:
 
schedule:
- cron: "0 */6 * * *"
 
permissions:
contents: write
 
jobs:
build:
runs-on: ubuntu-latest
 
steps:
- name: Checkout Repository
uses: actions/checkout@v4
 
- name: Setup Python
uses: actions/setup-python@v5
with:
python-version: "3.12"
 
- name: Install Dependencies
run: pip install -r requirements.txt
 
- name: Run Script
run: python main.py
 
- name: Commit Files
run: |
git config user.name github-actions
git config user.email github-actions@github.com
git add *.ics
git commit -m "Update calendar feeds" || echo "No changes"
git push
